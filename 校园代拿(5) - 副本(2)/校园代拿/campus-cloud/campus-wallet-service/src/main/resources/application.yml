server:
  port: 8106
  tomcat:
    max-http-post-size: 10MB

spring:
  application:
    name: campus-wallet-service
  config:
    import: optional:classpath:application-campus-shared.yml,optional:classpath:application-rabbitmq.yml,optional:classpath:application-seata.yml
  # 与 task 共用物理库，URL 加不同 seataResource，避免 Seata AT 同库双分支冲突
  datasource:
    url: jdbc:mysql://localhost:3306/campus_delivery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=45000&seataResource=wallet
  cloud:
    sentinel:
      transport:
        port: 8725
  flyway:
    enabled: false

campus:
  remote:
    audit-log: true
    system-message: true
  alipay:
    enabled: true
    app-id: "9021000164617524"
    # 下面这串必须完整上传到开放平台「接口加签方式 → 应用公钥」，不能只填支付宝公钥
    app-public-key: ""
    private-key: ${ALIPAY_PRIVATE_KEY:}
    # 下面这串是开放平台保存应用公钥后显示的「支付宝公钥」，用于验签回调
    alipay-public-key: ""
    gateway-url: "https://openapi-sandbox.dl.alipaydev.com/gateway.do"
    notify-url: "http://localhost:8080/api/wallet/alipay/notify"
    return-url: "http://localhost:8080/api/wallet/alipay/return"
    frontend-return-url: "http://localhost:5173/#/wallet"
    frontend-task-return-url: "http://localhost:5173/#/publish"


