server:
  port: 8104
  tomcat:
    max-http-post-size: 10MB

spring:
  application:
    name: campus-audit-service
  config:
    import: optional:classpath:application-campus-shared.yml,optional:classpath:application-rabbitmq.yml
  cloud:
    sentinel:
      transport:
        port: 8723
  flyway:
    enabled: false

campus:
  remote:
    realtime: true
    system-message: true


