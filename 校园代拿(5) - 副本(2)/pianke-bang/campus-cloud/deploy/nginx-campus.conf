# 校园代拿 · Nginx 整站示例（前端静态 + /api、/ws 反代到 campus-gateway :8080）
# 用法：
#   sudo cp nginx-campus.conf /etc/nginx/conf.d/campus.conf
#   修改 server_name、root；配置 HTTPS 证书后 listen 443 ssl
#   sudo nginx -t && sudo systemctl reload nginx
#
# 没有 location /api/ 时，浏览器访问 /api/... 不会到网关，会出现 504、注册卡住等问题。
# 没有 location /ws 时，聊天 WebSocket 无法连接。

server {
    listen 80;
    listen [::]:80;
    server_name xiaoxin1.xyz www.xiaoxin1.xyz;

    # 前端 npm run build 后 dist 内容拷到此目录（或你实际路径）
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：刷新子路径回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（必须指向本机 campus-gateway 监听的端口）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket（聊天、实时推送）
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/campus_access.log;
    error_log  /var/log/nginx/campus_error.log;
}
