server:
  port: 8103
  tomcat:
    max-http-post-size: 10MB

spring:
  application:
    name: campus-task-service
  config:
    import: optional:classpath:application-campus-shared.yml,optional:classpath:application-rabbitmq.yml,optional:classpath:application-seata.yml
  # 与 wallet 共用物理库，但 JDBC URL 加不同 seataResource，避免 AT 把两边识别成同一资源导致分支冲突
  datasource:
    url: jdbc:mysql://localhost:3306/campus_delivery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=45000&seataResource=task
  cloud:
    sentinel:
      transport:
        port: 8722
  flyway:
    enabled: false

app:
  elasticsearch:
    enabled: true
    hosts: http://127.0.0.1:9200
    index: campus_delivery_task
    reindex-on-startup: true

campus:
  remote:
    # true：发单/重提赏金走 Feign → wallet-service，由 @GlobalTransactional + Seata 协调
    wallet: true
    audit-log: true
    realtime: true
    system-message: true


